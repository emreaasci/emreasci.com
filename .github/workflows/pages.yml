# main'e her push'ta siteyi GitHub Pages'e yayınlar.
# Yalnız site dosyaları kopyalanır; docs, tests ve scripts yayına çıkmaz.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Testler
        run: node --test "tests/*.test.mjs"
      - name: Site dosyalarını topla
        run: |
          mkdir _site
          cp -r index.html 404.html CNAME .nojekyll css js assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
